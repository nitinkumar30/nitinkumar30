<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 460 260" width="460" height="260" font-family="'Segoe UI',Arial,sans-serif">
<defs>
  <clipPath id="rounded"><rect x="0" y="0" width="460" height="260" rx="16" ry="16"/></clipPath>
  
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#150821"/>
    <stop offset="100%" stop-color="#2b1050"/>
  </linearGradient>
  <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
    <stop offset="0%" stop-color="#ff3fb0"/>
    <stop offset="50%" stop-color="#b98bff"/>
    <stop offset="100%" stop-color="#ff7fd0"/>
    <animateTransform attributeName="gradientTransform" type="translate"
      values="-300 0; 300 0; -300 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  
</defs>
<g clip-path="url(#rounded)">
  <rect x="0" y="0" width="460" height="260" fill="url(#bg)"/>
  <rect x="0" y="0" width="460" height="260" fill="none" stroke="rgba(255,140,220,0.30)" stroke-width="1.5"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#f6ecff">Most Used Languages</text>
  <g>
          <text x="20" y="61" font-size="12.5" fill="#f6ecff" font-weight="600">Python</text>
          <text x="420" y="61" text-anchor="end" font-size="12" fill="#c3aee6">52%</text>
          <rect x="150" y="47" width="270" height="10" rx="5" fill="rgba(255,255,255,0.09)"/>
          <rect x="150" y="47" width="0" height="10" rx="5" fill="#3572A5">
            <animate attributeName="width" from="0" to="140.4" dur="1.1s" begin="0.50s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
          </rect>
        </g><g>
          <text x="20" y="95" font-size="12.5" fill="#f6ecff" font-weight="600">JavaScript</text>
          <text x="420" y="95" text-anchor="end" font-size="12" fill="#c3aee6">18%</text>
          <rect x="150" y="81" width="270" height="10" rx="5" fill="rgba(255,255,255,0.09)"/>
          <rect x="150" y="81" width="0" height="10" rx="5" fill="#f1e05a">
            <animate attributeName="width" from="0" to="48.6" dur="1.1s" begin="0.66s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
          </rect>
        </g><g>
          <text x="20" y="129" font-size="12.5" fill="#f6ecff" font-weight="600">HTML</text>
          <text x="420" y="129" text-anchor="end" font-size="12" fill="#c3aee6">12%</text>
          <rect x="150" y="115" width="270" height="10" rx="5" fill="rgba(255,255,255,0.09)"/>
          <rect x="150" y="115" width="0" height="10" rx="5" fill="#e34c26">
            <animate attributeName="width" from="0" to="32.4" dur="1.1s" begin="0.82s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
          </rect>
        </g><g>
          <text x="20" y="163" font-size="12.5" fill="#f6ecff" font-weight="600">Robot Framework</text>
          <text x="420" y="163" text-anchor="end" font-size="12" fill="#c3aee6">10%</text>
          <rect x="150" y="149" width="270" height="10" rx="5" fill="rgba(255,255,255,0.09)"/>
          <rect x="150" y="149" width="0" height="10" rx="5" fill="#00c0b5">
            <animate attributeName="width" from="0" to="27.0" dur="1.1s" begin="0.98s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
          </rect>
        </g><g>
          <text x="20" y="197" font-size="12.5" fill="#f6ecff" font-weight="600">Shell</text>
          <text x="420" y="197" text-anchor="end" font-size="12" fill="#c3aee6">8%</text>
          <rect x="150" y="183" width="270" height="10" rx="5" fill="rgba(255,255,255,0.09)"/>
          <rect x="150" y="183" width="0" height="10" rx="5" fill="#89e051">
            <animate attributeName="width" from="0" to="21.6" dur="1.1s" begin="1.14s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
          </rect>
        </g><g><rect x="20.0" y="226" width="0" height="14" fill="#3572A5">
          <animate attributeName="width" from="0" to="218.4" dur="1s" begin="1.40s" fill="freeze"/>
        </rect><rect x="238.4" y="226" width="0" height="14" fill="#f1e05a">
          <animate attributeName="width" from="0" to="75.6" dur="1s" begin="1.48s" fill="freeze"/>
        </rect><rect x="314.0" y="226" width="0" height="14" fill="#e34c26">
          <animate attributeName="width" from="0" to="50.4" dur="1s" begin="1.56s" fill="freeze"/>
        </rect><rect x="364.4" y="226" width="0" height="14" fill="#00c0b5">
          <animate attributeName="width" from="0" to="42.0" dur="1s" begin="1.64s" fill="freeze"/>
        </rect><rect x="406.4" y="226" width="0" height="14" fill="#89e051">
          <animate attributeName="width" from="0" to="33.6" dur="1s" begin="1.72s" fill="freeze"/>
        </rect><rect x="20" y="226" width="420" height="14" rx="7" fill="none" stroke="rgba(255,140,220,0.30)"/></g>
</g>
</svg>