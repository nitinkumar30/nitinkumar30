<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 460 200" width="460" height="200" font-family="'Segoe UI',Arial,sans-serif">
<defs>
  <clipPath id="rounded"><rect x="0" y="0" width="460" height="200" rx="16" ry="16"/></clipPath>
  
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#150821"/>
    <stop offset="100%" stop-color="#2b1050"/>
  </linearGradient>
  <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
    <stop offset="0%" stop-color="#ff3fb0"/>
    <stop offset="50%" stop-color="#b98bff"/>
    <stop offset="100%" stop-color="#ff7fd0"/>
    <animateTransform attributeName="gradientTransform" type="translate"
      values="-300 0; 300 0; -300 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  
</defs>
<g clip-path="url(#rounded)">
  <rect x="0" y="0" width="460" height="200" fill="url(#bg)"/>
  <rect x="0" y="0" width="460" height="200" fill="none" stroke="rgba(255,140,220,0.30)" stroke-width="1.5"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#f6ecff">Trophy Case</text>
  <g transform="translate(62.0,90)" opacity="0">
