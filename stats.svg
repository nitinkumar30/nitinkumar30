<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 460 260" width="460" height="260" font-family="'Segoe UI',Arial,sans-serif">
<defs>
  <clipPath id="rounded"><rect x="0" y="0" width="460" height="260" rx="16" ry="16"/></clipPath>
  
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#150821"/>
    <stop offset="100%" stop-color="#2b1050"/>
  </linearGradient>
  <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
    <stop offset="0%" stop-color="#ff3fb0"/>
    <stop offset="50%" stop-color="#b98bff"/>
    <stop offset="100%" stop-color="#ff7fd0"/>
    <animateTransform attributeName="gradientTransform" type="translate"
      values="-300 0; 300 0; -300 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  
</defs>
<g clip-path="url(#rounded)">
  <rect x="0" y="0" width="460" height="260" fill="url(#bg)"/>
  <rect x="0" y="0" width="460" height="260" fill="none" stroke="rgba(255,140,220,0.30)" stroke-width="1.5"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#f6ecff">Nitin&#x27;s GitHub Stats</text>
  <g transform="translate(92,148) rotate(-90)">
      <circle r="58" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="12"/>
      <circle r="58" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="364.4" stroke-dashoffset="364.4">
        <animate attributeName="stroke-dashoffset" from="364.4" to="51.0"
          dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
      </circle>
    </g>
    <text x="92" y="144" text-anchor="middle" font-size="30" font-weight="800" fill="#f6ecff" filter="url(#glow)">A+</text>
    <text x="92" y="166" text-anchor="middle" font-size="11" fill="#c3aee6" letter-spacing="1.5">DEV RANK</text>
    <circle cx="92" cy="148" r="64" fill="none" stroke="#ff3fb0" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.5;0" dur="2.4s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="62;72;62" dur="2.4s" begin="1.9s" repeatCount="indefinite"/>
    </circle><g transform="translate(200,76)" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.90s" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" from="240,76" to="200,76"
            dur="0.6s" begin="0.90s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1" additive="sum"/>
          <text x="0" y="0" font-size="12.5" fill="#c3aee6" font-weight="600">Public Repos</text>
          <text x="220" y="0" text-anchor="end" font-size="12.5" fill="#f6ecff" font-weight="800">42</text>
          <rect x="0" y="8" width="220" height="6" rx="3" fill="rgba(255,255,255,0.09)"/>
          <rect x="0" y="8" width="0" height="6" rx="3" fill="url(#accent)">
            <animate attributeName="width" from="0" to="158" dur="1.2s" begin="1.10s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
          </rect>
        </g><g transform="translate(200,118)" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.08s" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" from="240,118" to="200,118"
            dur="0.6s" begin="1.08s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1" additive="sum"/>
          <text x="0" y="0" font-size="12.5" fill="#c3aee6" font-weight="600">Total Stars</text>
          <text x="220" y="0" text-anchor="end" font-size="12.5" fill="#f6ecff" font-weight="800">180+</text>
          <rect x="0" y="8" width="220" height="6" rx="3" fill="rgba(255,255,255,0.09)"/>
          <rect x="0" y="8" width="0" height="6" rx="3" fill="url(#accent)">
            <animate attributeName="width" from="0" to="198" dur="1.2s" begin="1.28s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
          </rect>
        </g><g transform="translate(200,160)" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.26s" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" from="240,160" to="200,160"
            dur="0.6s" begin="1.26s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1" additive="sum"/>
          <text x="0" y="0" font-size="12.5" fill="#c3aee6" font-weight="600">Followers</text>
          <text x="220" y="0" text-anchor="end" font-size="12.5" fill="#f6ecff" font-weight="800">65</text>
          <rect x="0" y="8" width="220" height="6" rx="3" fill="rgba(255,255,255,0.09)"/>
          <rect x="0" y="8" width="0" height="6" rx="3" fill="url(#accent)">
            <animate attributeName="width" from="0" to="110" dur="1.2s" begin="1.46s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
          </rect>
        </g><g transform="translate(200,202)" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.44s" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" from="240,202" to="200,202"
            dur="0.6s" begin="1.44s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1" additive="sum"/>
          <text x="0" y="0" font-size="12.5" fill="#c3aee6" font-weight="600">Contributions</text>
          <text x="220" y="0" text-anchor="end" font-size="12.5" fill="#f6ecff" font-weight="800">1.4k</text>
          <rect x="0" y="8" width="220" height="6" rx="3" fill="rgba(255,255,255,0.09)"/>
          <rect x="0" y="8" width="0" height="6" rx="3" fill="url(#accent)">
            <animate attributeName="width" from="0" to="209" dur="1.2s" begin="1.64s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
          </rect>
        </g>
</g>
</svg>