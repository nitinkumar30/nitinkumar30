name: Generate Snake Animation

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: nitinkumar30
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff3fb0
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff3fb0&color_dots=#2b1050,#8b3ffb,#b98bff,#ff7fd0,#ff3fb0
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=#c40d78&color_dots=#f6ecff,#e3c9fa,#c98bef,#e0399e,#c40d78

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
