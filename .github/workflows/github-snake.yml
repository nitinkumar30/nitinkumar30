name: Generate GitHub Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: nitinkumar30
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff3cac&color_dots=%231b0b2a,%234b154f,%237c3aed,%23d946ef,%23ff5db8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff3cac&color_dots=%231b0b2a,%234b154f,%237c3aed,%23d946ef,%23ff5db8

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          build_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
